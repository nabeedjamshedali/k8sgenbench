apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
  labels:
    app: user-sim
spec:
  template:
    metadata:
      labels:
        app: user-sim
    spec:
      serviceAccountName: sock-shop
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      restartPolicy: Never
      containers:
        - name: user-sim
          image: weaveworksdemos/load-test:0.1.1
          command:
            - "-d"
            - "60"
            - "-r"
            - "200"
            - "-c"
            - "2"
            - "-h"
            - "edge-router"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi