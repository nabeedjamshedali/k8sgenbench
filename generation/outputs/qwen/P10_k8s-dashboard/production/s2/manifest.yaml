apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-dashboard
  labels:
    kubernetes.io/metadata.name: kubernetes-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-dashboard
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - endpoints
      - resourcequotas
      - limitranges
      - events
    verbs: ["list", "get", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["list", "get", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["list", "get", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["list", "get", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["list", "get", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - nodes/proxy
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/proxy
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/attach
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - services/proxy
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - services/httpget
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - persistentvolumes
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - resourcequotas
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - nodes/proxy
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/proxy
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/attach
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - services/proxy
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - services/httpget
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-dashboard
subjects:
  - kind: ServiceAccount
    name: kubernetes-dashboard
    namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  labels:
    k8s-app: kubernetes-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    k8s-app: kubernetes-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  labels:
    k8s-app: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: kubernetes-dashboard
  template:
    metadata:
      labels:
        k8s-app: kubernetes-dashboard
    spec:
      serviceAccountName: kubernetes-dashboard
      containers:
        - name: kubernetes-dashboard
          image: kubernetesui/dashboard:v2.7.0
          ports:
            - containerPort: 8443
              protocol: TCP
          args:
            - --auto-generate-certificates
            - --namespace=kubernetes-dashboard
            - --enable-skip-login
            - --metrics-provider=sidecar
            - --api-log-level=INFO
            - --token-ttl=900
            - --authentication-mode=token
            - --enable-insecure-login=false
            - --disable-settings-authorizer=false
            - --system-banner=
            - --system-banner-severity=INFO
            - --insecure-port=9090
            - --port=8443
            - --insecure-bind-address=127.0.0.1
            - --bind-address=0.0.0.0
            - --default-cert-dir=/certs
            - --metric-client-check-period=30
          livenessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}