      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-sim
          image: weaveworksdemos/load-test:0.1.1
          command:
            - /bin/sh
            - -c
            - "./load-test -d 60 -r 200 -c 2 -h edge-router"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL