apiVersion: v1
kind: Namespace
metadata:
  name: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/part-of: emojivoto
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: emojivoto
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: emojivoto
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app: emoji-svc
    app.kubernetes.io/name: emoji-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  type: ClusterIP
  selector:
    app: emoji-svc
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app: voting-svc
    app.kubernetes.io/name: voting-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  type: ClusterIP
  selector:
    app: voting-svc
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8801
      targetPort: metrics
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app: emoji-svc
    app.kubernetes.io/name: emoji-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: emoji-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: emoji-svc
        app.kubernetes.io/name: emoji-svc
        app.kubernetes.io/part-of: emojivoto
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emoji-svc
          image: buoyantio/emojivoto-emoji-svc:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: GRPC_PORT
              value: "8080"
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app: voting-svc
    app.kubernetes.io/name: voting-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  # The voting service stores votes in memory.
  # Keep a single replica to avoid inconsistent vote counts.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: voting-svc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: voting-svc
        app.kubernetes.io/name: voting-svc
        app.kubernetes.io/part-of: emojivoto
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8801"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voting-svc
          image: buoyantio/emojivoto-voting-svc:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: GRPC_PORT
              value: "8080"
            - name: PROM_PORT
              value: "8801"
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8801
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: emojivoto
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: emojivoto
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: buoyantio/emojivoto-web:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: WEB_PORT
              value: "8080"
            - name: EMOJISVC_HOST
              value: "emoji-svc.emojivoto.svc.cluster.local:8080"
            - name: VOTINGSVC_HOST
              value: "voting-svc.emojivoto.svc.cluster.local:8080"
            - name: INDEX_BUNDLE
              value: "dist/index_bundle.js"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: emojivoto
  labels:
    app: vote-bot
    app.kubernetes.io/name: vote-bot
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: vote-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vote-bot
        app.kubernetes.io/name: vote-bot
        app.kubernetes.io/part-of: emojivoto
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vote-bot
          image: buoyantio/emojivoto-web:v11
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/emojivoto-vote-bot
          env:
            - name: WEB_HOST
              value: "web.emojivoto.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: emojivoto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emoji-svc
  namespace: emojivoto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emoji-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: emojivoto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: emoji-svc
  namespace: emojivoto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: emoji-svc

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: emojivoto
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: emojivoto
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress-controller traffic to the web frontend.
    # Restrict this to the ingress-controller namespace/pods
    # when the controller's labels are known.
    - ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-emoji-grpc
  namespace: emojivoto
spec:
  podSelector:
    matchLabels:
      app: emoji-svc
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-voting-grpc
  namespace: emojivoto
spec:
  podSelector:
    matchLabels:
      app: voting-svc
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vote-bot-to-web
  namespace: emojivoto
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vote-bot
      ports:
        - protocol: TCP
          port: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: emojivoto
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: emojivoto
  annotations:
    # Replace with provider-specific annotations if required.
    # Configure HTTPS at the cloud load balancer or
    # use a dedicated ingress controller with TLS.
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  externalTrafficPolicy: Cluster
  sessionAffinity: None