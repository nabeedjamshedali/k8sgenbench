apiVersion: v1
kind: Namespace
metadata:
  name: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app: emoji-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emoji-svc
  template:
    metadata:
      labels:
        app: emoji-svc
    spec:
      containers:
        - name: emoji-svc
          image: buoyantio/emojivoto-emoji-svc:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: GRPC_PORT
              value: "8080"
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app: emoji-svc
spec:
  type: ClusterIP
  selector:
    app: emoji-svc
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app: voting-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-svc
  template:
    metadata:
      labels:
        app: voting-svc
    spec:
      containers:
        - name: voting-svc
          image: buoyantio/emojivoto-voting-svc:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: GRPC_PORT
              value: "8080"
            - name: PROM_PORT
              value: "8801"
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8801
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app: voting-svc
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8801"
spec:
  type: ClusterIP
  selector:
    app: voting-svc
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 8801
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: emojivoto
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: buoyantio/emojivoto-web:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: WEB_PORT
              value: "8080"
            - name: EMOJISVC_HOST
              value: "emoji-svc:8080"
            - name: VOTINGSVC_HOST
              value: "voting-svc:8080"
            - name: INDEX_BUNDLE
              value: "dist/index_bundle.js"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: emojivoto
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: emojivoto
  labels:
    app: vote-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-bot
  template:
    metadata:
      labels:
        app: vote-bot
    spec:
      containers:
        - name: vote-bot
          image: buoyantio/emojivoto-web:v11
          imagePullPolicy: IfNotPresent
          command:
            - emojivoto-vote-bot
          env:
            - name: WEB_HOST
              value: "web:8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi