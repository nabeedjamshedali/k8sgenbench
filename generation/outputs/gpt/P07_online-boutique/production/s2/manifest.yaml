---
# Network Policies
# Requires a CNI plugin with NetworkPolicy enforcement.
# Namespace traffic is isolated by default.
# Allow internal application communication, DNS, frontend ingress,
# and external HTTPS for services that require outbound connectivity.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: online-boutique
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow application pods to communicate inside their own namespace.
# The Redis policy below further restricts Redis ingress.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: online-boutique
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - redis-cart
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

---
# Only cartservice may connect to Redis.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-restricted-access
  namespace: online-boutique
spec:
  podSelector:
    matchLabels:
      app: redis-cart
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cartservice
      ports:
        - protocol: TCP
          port: 6379

---
# DNS resolution for application pods.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: online-boutique
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Public HTTP ingress is permitted only to frontend.
# Production TLS termination must be configured at the edge.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: online-boutique
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080

---
# Allow external HTTPS calls for applications that fetch external data.
# Egress restrictions should be tightened to approved destinations
# using a compatible CNI, firewall, or egress gateway.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-https
  namespace: online-boutique
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - currencyservice
          - frontend
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443

---
# Namespace resource governance.
# Adjust to match workload benchmarking and node capacity.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: boutique-resource-quota
  namespace: online-boutique
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 24Gi
    limits.cpu: "40"
    limits.memory: 48Gi
    pods: "80"
    persistentvolumeclaims: "5"
    requests.storage: 100Gi
    services.loadbalancers: "2"

---
# Default resource requirements for any additional containers.

apiVersion: v1
kind: LimitRange
metadata:
  name: boutique-limit-range
  namespace: online-boutique
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi