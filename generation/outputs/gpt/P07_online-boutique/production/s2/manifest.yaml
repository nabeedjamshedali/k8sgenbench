# Online Boutique - Kubernetes Production Deployment
# Source: GoogleCloudPlatform/microservices-demo
#
# Includes:
# - Dedicated namespace
# - 10 application microservices
# - Redis cart storage with persistent volume
# - Optional load generator (disabled by default)
# - Internal ClusterIP services
# - External frontend LoadBalancer
# - CPU and memory resource constraints
# - Liveness, readiness, and startup probes
# - Non-root security contexts
# - Horizontal Pod Autoscalers
# - Pod Disruption Budgets
# - Network Policies
#
# Images use the published v0.10.7 release.
# For production, replace image tags with validated immutable digests.
# External production traffic should use a TLS-enabled ingress/gateway.
# Redis is single-instance; use managed/HA Redis for production availability.

apiVersion: v1
kind: Namespace
metadata:
  name: online-boutique
  labels:
    app.kubernetes.io/name: online-boutique
    app.kubernetes.io/part-of: online-boutique
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Default service account for application workloads.
# Kubernetes API token mounting is disabled.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: boutique-app
  namespace: online-boutique
automountServiceAccountToken: false

---
# Redis persistent storage.
# Requires a default StorageClass.

apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: online-boutique
  labels:
    app: redis-cart
spec:
  type: ClusterIP
  selector:
    app: redis-cart
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cart
  namespace: online-boutique
  labels:
    app: redis-cart
spec:
  serviceName: redis-cart
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      serviceAccountName: boutique-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --dir
            - /data
            - --save
            - "60"
            - "1"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

