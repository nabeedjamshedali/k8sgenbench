  template:
    metadata: {labels: {app: shippingservice}}
    spec:
      containers:
      - name: shippingservice
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice:v0.10.7
        ports: [{containerPort: 50051, name: grpc}]
        env:
        - {name: PORT, value: '50051'}
        - {name: APP_PORT, value: '50051'}
        - {name: DISABLE_PROFILER, value: '1'}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
