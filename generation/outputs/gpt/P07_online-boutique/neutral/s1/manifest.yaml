---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend:v0.10.7
        ports: [{containerPort: 8080, name: http}]
        env:
        - {name: PORT, value: '8080'}
        - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: 'productcatalogservice:3550'}
        - {name: CURRENCY_SERVICE_ADDR, value: 'currencyservice:7000'}
        - {name: CART_SERVICE_ADDR, value: 'cartservice:7070'}
        - {name: RECOMMENDATION_SERVICE_ADDR, value: 'recommendationservice:8080'}
        - {name: SHIPPING_SERVICE_ADDR, value: 'shippingservice:50051'}
        - {name: CHECKOUT_SERVICE_ADDR, value: 'checkoutservice:5050'}
        - {name: AD_SERVICE_ADDR, value: 'adservice:9555'}
        - {name: ENABLE_PROFILER, value: '0'}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe: {httpGet: {path: /_healthz, port: 8080, httpHeaders: [{name: Cookie, value: shop_session-id=x-health-probe}]}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /_healthz, port: 8080, httpHeaders: [{name: Cookie, value: shop_session-id=x-health-probe}]}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: 8080, protocol: TCP}]
