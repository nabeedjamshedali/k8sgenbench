---
apiVersion: v1
kind: Service
metadata: {name: frontend-external}
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: 8080, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-cart}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis-cart}}
  template:
    metadata: {labels: {app: redis-cart}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{name: redis, containerPort: 6379}]
        resources:
          requests: {cpu: 70m, memory: 100Mi}
          limits: {cpu: 250m, memory: 256Mi}
        readinessProbe: {tcpSocket: {port: 6379}, periodSeconds: 5}
        livenessProbe: {tcpSocket: {port: 6379}, periodSeconds: 10}
        volumeMounts: [{mountPath: /data, name: redis-data}]
      volumes: [{name: redis-data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-cart}
spec:
  type: ClusterIP
  selector: {app: redis-cart}
  ports: [{name: redis, port: 6379, targetPort: 6379, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgenerator}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgenerator}}
  template:
    metadata: {labels: {app: loadgenerator}}
    spec:
      initContainers:
      - name: wait-for-frontend
        image: busybox:1.36
        command: [sh, -c, 'until wget -q -O /dev/null http://frontend:80; do sleep 5; done']
      containers:
      - name: loadgenerator
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator:v0.10.7
        env:
        - {name: FRONTEND_ADDR, value: 'frontend:80'}
        - {name: USERS, value: '10'}
        - {name: RATE, value: '1'}
        resources:
          requests: {cpu: 200m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
