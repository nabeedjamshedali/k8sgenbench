# Online Boutique: Deployments, internal Services, frontend LoadBalancer, and Redis
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: adservice}
spec:
  replicas: 1
  selector: {matchLabels: {app: adservice}}
  template:
    metadata: {labels: {app: adservice}}
    spec:
      containers:
      - name: adservice
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice:v0.10.7
        ports: [{containerPort: 9555, name: grpc}]
        env:
        - {name: PORT, value: '9555'}
        resources:
          requests: {cpu: 200m, memory: 180Mi}
          limits: {cpu: 300m, memory: 300Mi}
        readinessProbe: {grpc: {port: 9555}, initialDelaySeconds: 20, periodSeconds: 10}
        livenessProbe: {grpc: {port: 9555}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: adservice}
spec:
  type: ClusterIP
  selector: {app: adservice}
  ports: [{name: grpc, port: 9555, targetPort: 9555, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cartservice}
spec:
  replicas: 1
  selector: {matchLabels: {app: cartservice}}
  template:
    metadata: {labels: {app: cartservice}}
    spec:
      containers:
      - name: cartservice
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice:v0.10.7
        ports: [{containerPort: 7070, name: grpc}]
        env:
        - {name: REDIS_ADDR, value: 'redis-cart:6379'}
        resources:
          requests: {cpu: 200m, memory: 64Mi}
          limits: {cpu: 300m, memory: 128Mi}
        readinessProbe: {grpc: {port: 7070}, initialDelaySeconds: 20, periodSeconds: 10}
        livenessProbe: {grpc: {port: 7070}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: cartservice}
spec:
  type: ClusterIP
  selector: {app: cartservice}
  ports: [{name: grpc, port: 7070, targetPort: 7070, protocol: TCP}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkoutservice}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkoutservice}}
  template:
    metadata: {labels: {app: checkoutservice}}
    spec:
      containers:
      - name: checkoutservice
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice:v0.10.7
        ports: [{containerPort: 5050, name: grpc}]
        env:
        - {name: PORT, value: '5050'}
        - {name: PRODUCT_CATALOG_SERVICE_ADDR, value: 'productcatalogservice:3550'}
        - {name: SHIPPING_SERVICE_ADDR, value: 'shippingservice:50051'}
        - {name: PAYMENT_SERVICE_ADDR, value: 'paymentservice:50051'}
        - {name: EMAIL_SERVICE_ADDR, value: 'emailservice:5000'}
        - {name: CURRENCY_SERVICE_ADDR, value: 'currencyservice:7000'}
        - {name: CART_SERVICE_ADDR, value: 'cartservice:7070'}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe: {grpc: {port: 5050}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {grpc: {port: 5050}, initialDelaySeconds: 5, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: checkoutservice}
spec:
  type: ClusterIP
  selector: {app: checkoutservice}
  ports: [{name: grpc, port: 5050, targetPort: 5050, protocol: TCP}]
