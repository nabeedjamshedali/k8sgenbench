# ============================================================
# Production-ready Grafana Kubernetes Deployment
#
# Architecture:
# - Dedicated namespace
# - External PostgreSQL database
# - Two Grafana replicas
# - Kubernetes Secrets for sensitive configuration
# - ConfigMap for Grafana settings
# - ClusterIP Service
# - TLS-enabled Ingress
# - Health probes
# - Resource requests and limits
# - Pod disruption budget
# - Pod anti-affinity
# - Horizontal Pod Autoscaler
# - Non-root containers
#
# Prerequisites:
# 1. External PostgreSQL database with TLS enabled.
# 2. Replace all CHANGE_ME values before deployment.
# 3. Configure DNS for grafana.example.com.
# 4. Install an NGINX Ingress Controller.
# 5. Create the grafana-tls TLS Secret.
# 6. Install metrics-server for HPA functionality.
# 7. Use a secret manager in production rather than storing
#    plaintext credentials in version control.
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_STRONG_ADMIN_PASSWORD"
  secret-key: "CHANGE_ME_RANDOM_64_CHARACTER_SECRET_KEY"
  database-host: "postgres.example.internal:5432"
  database-name: "grafana"
  database-user: "grafana"
  database-password: "CHANGE_ME_DATABASE_PASSWORD"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  grafana.ini: |
    app_mode = production

    [paths]
    data = /var/lib/grafana
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning

    [server]
    protocol = http
    http_addr = 0.0.0.0
    http_port = 3000
    domain = grafana.example.com
    root_url = https://grafana.example.com/
    enforce_domain = true
    enable_gzip = true
    router_logging = false

    [database]
    type = postgres
    ssl_mode = require
    max_idle_conn = 10
    max_open_conn = 100
    conn_max_lifetime = 14400
    migration_locking = true
    high_availability = true

    [remote_cache]
    type = database

    [security]
    disable_initial_admin_creation = false
    cookie_secure = true
    cookie_samesite = lax
    allow_embedding = false
    disable_brute_force_login_protection = false
    brute_force_login_protection_max_attempts = 5
    disable_username_login_protection = false
    disable_ip_address_login_protection = false
    content_security_policy = true
    strict_transport_security = true
    strict_transport_security_max_age_seconds = 31536000
    x_content_type_options = true
    disable_gravatar = true

    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    default_theme = dark

    [auth]
    disable_login = false
    disable_login_form = false
    token_rotation_interval_minutes = 10
    login_maximum_inactive_lifetime_duration = 7d
    login_maximum_lifetime_duration = 30d

    [auth.anonymous]
    enabled = false

    [auth.basic]
    enabled = true
    password_policy = true

    [analytics]
    reporting_enabled = false
    check_for_updates = true
    check_for_plugin_updates = true

    [snapshots]
    enabled = true
    external_enabled = false
    public_mode = false

    [dashboards]
    versions_to_keep = 20
    min_refresh_interval = 5s

    [dataproxy]
    logging = false
    timeout = 30
    dialTimeout = 10
    max_idle_connections = 100
    idle_conn_timeout_seconds = 90
    response_limit = 0
    row_limit = 1000000

    [log]
    mode = console
    level = info

    [log.console]
    format = json

    [metrics]
    enabled = true
    disable_total_stats = false

    [smtp]
    enabled = false

    [feature_toggles]
    enable =

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
                    app.kubernetes.io/component: server
                topologyKey: kubernetes.io/hostname

      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini

            - name: GF_PATHS_DATA
              value: /var/lib/grafana

            - name: GF_PATHS_LOGS
              value: /var/log/grafana

            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins

            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password

            - name: GF_SECURITY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: secret-key

            - name: GF_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: database-host

            - name: GF_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: database-name

            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: database-user

            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: database-password

            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.example.com/"

            - name: GF_SERVER_DOMAIN
              value: "grafana.example.com"

            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"

            - name: GF_LOG_MODE
              value: "console"

            - name: GF_LOG_LEVEL
              value: "info"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"

          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true

            - name: grafana-data
              mountPath: /var/lib/grafana

            - name: grafana-logs
              mountPath: /var/log/grafana

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
            defaultMode: 0444

        - name: grafana-data
          emptyDir:
            sizeLimit: 2Gi

        - name: grafana-logs
          emptyDir:
            sizeLimit: 1Gi

        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  sessionAffinity: None
---
# ============================================================
# HTTPS Ingress
#
# Requires:
# - NGINX Ingress Controller
# - DNS record pointing to the ingress endpoint
# - TLS Secret named grafana-tls
#
# TLS termination happens at the ingress controller.
# Internal Grafana traffic uses HTTP.
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.example.com
      secretName: grafana-tls
  rules:
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
---
# ============================================================
# Pod Disruption Budget
# Maintains at least one available Grafana replica
# during voluntary disruptions.
# ============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana-pdb
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: server
---
# ============================================================
# Horizontal Pod Autoscaler
# Requires Kubernetes metrics-server.
#
# External PostgreSQL is required for safe scaling.
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grafana-hpa
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grafana

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
# ============================================================
# Network Policy
#
# Restricts inbound traffic to:
# - Pods in the ingress-nginx namespace
# - Grafana pods in the same namespace
#
# Egress is permitted for:
# - DNS
# - External PostgreSQL and provisioned data sources
#
# Adjust egress restrictions for your environment.
# The ingress controller namespace must have the label:
# kubernetes.io/metadata.name=ingress-nginx
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: server

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 3000

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # External PostgreSQL, HTTPS integrations and data sources.
    # Tighten destinations to trusted CIDRs in production.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

    # Communication between Grafana replicas.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 3000
---
# ============================================================
# Grafana Data Source Provisioning
#
# Example Prometheus data source.
# Update the URL to match the Prometheus Service in your
# Kubernetes cluster.
#
# The provisioning ConfigMap must be mounted into the Grafana
# Deployment at /etc/grafana/provisioning/datasources.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1

    prune: true

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
---
# ============================================================
# Grafana Dashboard Provisioning
#
# The provisioning ConfigMap must be mounted into the Grafana
# Deployment at /etc/grafana/provisioning/dashboards.
#
# Dashboard JSON files must also be mounted into
# /var/lib/grafana/dashboards.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true