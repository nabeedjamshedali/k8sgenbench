---
# User Simulator
# Runs as a Job because the provided load-test command is finite.
apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: user-sim
    spec:
      hostname: user-simulator
      restartPolicy: Never
      containers:
        - name: user-sim
          image: weaveworksdemos/load-test:0.1.1
          imagePullPolicy: IfNotPresent
          args:
            - "-d"
            - "60"
            - "-r"
            - "200"
            - "-c"
            - "2"
            - "-h"
            - "edge-router"
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi