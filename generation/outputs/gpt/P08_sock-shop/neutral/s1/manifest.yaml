# Queue Master
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-master
  namespace: sock-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-master
  template:
    metadata:
      labels:
        app: queue-master
    spec:
      hostname: queue-master
      containers:
        - name: queue-master
          image: weaveworksdemos/queue-master:0.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: docker-socket
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        # Requires a Docker-based node runtime.
        # Remove this hostPath mount for clusters using containerd
        # if queue-master does not require Docker API access.
        # Mounting the Docker socket grants privileged host access.
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
