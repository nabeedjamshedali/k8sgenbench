apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: teastore-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/component: registry
    app.kubernetes.io/part-of: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-registry
        app.kubernetes.io/component: registry
        app.kubernetes.io/part-of: teastore
    spec:
      containers:
        - name: registry
          image: descartesresearch/teastore-registry:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: USE_POD_IP
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-db
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app.kubernetes.io/name: teastore-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-db
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: teastore
    spec:
      containers:
        - name: db
          image: descartesresearch/teastore-db:latest
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-persistence
  labels:
    app.kubernetes.io/name: teastore-persistence
    app.kubernetes.io/component: persistence
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: teastore-persistence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-persistence
  labels:
    app.kubernetes.io/name: teastore-persistence
    app.kubernetes.io/component: persistence
    app.kubernetes.io/part-of: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-persistence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-persistence
        app.kubernetes.io/component: persistence
        app.kubernetes.io/part-of: teastore
    spec:
      containers:
        - name: persistence
          image: descartesresearch/teastore-persistence:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REGISTRY_HOST
              value: "teastore-registry"
            - name: REGISTRY_PORT
              value: "8080"
            - name: SERVICE_PORT
              value: "8080"
            - name: DB_HOST
              value: "teastore-db"
            - name: DB_PORT
              value: "3306"
            - name: USE_POD_IP
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
