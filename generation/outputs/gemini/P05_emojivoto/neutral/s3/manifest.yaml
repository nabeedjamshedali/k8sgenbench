apiVersion: v1
kind: Namespace
metadata:
  name: emojivoto
---
apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emoji-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: emoji-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emoji-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emoji-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emoji-svc
        app.kubernetes.io/part-of: emojivoto
    spec:
      containers:
        - name: emoji-svc
          image: buoyantio/emojivoto-emoji-svc:v11
          env:
            - name: GRPC_PORT
              value: "8080"
          ports:
            - name: grpc
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: voting-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
    - name: prometheus
      port: 8801
      targetPort: 8801
  selector:
    app.kubernetes.io/name: voting-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: voting-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voting-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting-svc
        app.kubernetes.io/part-of: emojivoto
    spec:
      containers:
        - name: voting-svc
          image: buoyantio/emojivoto-voting-svc:v11
          env:
            - name: GRPC_PORT
              value: "8080"
            - name: PROM_PORT
              value: "8801"
          ports:
            - name: grpc
              containerPort: 8080
            - name: prometheus
              containerPort: 8801
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: web-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: web-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: web-svc
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-svc
        app.kubernetes.io/part-of: emojivoto
    spec:
      containers:
        - name: web-svc
          image: buoyantio/emojivoto-web:v11
          env:
            - name: WEB_PORT
              value: "8080"
            - name: EMOJISVC_HOST
              value: "emoji-svc.emojivoto.svc.cluster.local:8080"
            - name: VOTINGSVC_HOST
              value: "voting-svc.emojivoto.svc.cluster.local:8080"
            - name: INDEX_BUNDLE
              value: "dist/index_bundle.js"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: vote-bot
    app.kubernetes.io/part-of: emojivoto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vote-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vote-bot
        app.kubernetes.io/part-of: emojivoto
    spec:
      containers:
        - name: vote-bot
          image: buoyantio/emojivoto-web:v11
          command:
            - emojivoto-vote-bot
          env:
            - name: WEB_HOST
              value: "web-svc.emojivoto.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi