apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  labels:
    app: emoji-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emoji-svc
  template:
    metadata:
      labels:
        app: emoji-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emoji-svc
          image: buoyantio/emojivoto-emoji-svc:v11
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: GRPC_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: grpc
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
spec:
  selector:
    app: emoji-svc
  ports:
    - port: 8080
      targetPort: 8080
      name: grpc
---
