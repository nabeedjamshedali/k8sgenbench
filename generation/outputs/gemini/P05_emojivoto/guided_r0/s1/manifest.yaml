apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
  labels:
    app.kubernetes.io/name: emoji-svc
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: grpc
  selector:
    app.kubernetes.io/name: emoji-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  labels:
    app.kubernetes.io/name: emoji-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: emoji-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emoji-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emoji-svc
          image: "buoyantio/emojivoto-emoji-svc:v11"
          env:
            - name: GRPC_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: grpc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
