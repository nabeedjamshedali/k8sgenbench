apiVersion: v1
kind: Namespace
metadata:
  name: wordsmith
  labels:
    app.kubernetes.io/part-of: wordsmith
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: wordsmith
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: wordsmith
