apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
  labels:
    name: user-sim
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        name: user-sim
    spec:
      restartPolicy: Never
      containers:
        - name: user-sim
          image: weaveworksdemos/load-test:0.1.1
          command: ["/usr/local/bin/runLoadTest.sh"]
          args: ["-d", "60", "-r", "200", "-c", "2", "-h", "edge-router"]
          securityContext:
            capabilities:
              drop:
                - all
            readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux
