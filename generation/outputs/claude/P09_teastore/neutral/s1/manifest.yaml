apiVersion: v1
kind: Namespace
metadata:
  name: teastore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: teastore
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: descartesresearch/teastore-registry
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: registry
            - name: SERVICE_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: teastore
spec:
  selector:
    app: registry
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: teastore
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: descartesresearch/teastore-db
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: teastore
spec:
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence
  namespace: teastore
  labels:
    app: persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistence
  template:
    metadata:
      labels:
        app: persistence
    spec:
      containers:
        - name: persistence
          image: descartesresearch/teastore-persistence
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: persistence
            - name: REGISTRY_HOST
              value: registry
            - name: REGISTRY_PORT
              value: "8080"
            - name: SERVICE_PORT
              value: "8080"
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: persistence
  namespace: teastore
spec:
  selector:
    app: persistence
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
