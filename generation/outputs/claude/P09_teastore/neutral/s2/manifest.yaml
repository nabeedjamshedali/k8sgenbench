apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: teastore
  labels:
    app: teastore
    component: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      component: webui
  template:
    metadata:
      labels:
        app: teastore
        component: webui
    spec:
      containers:
        - name: webui
          image: descartesresearch/teastore-webui:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: webui
            - name: SERVICE_PORT
              value: "8080"
            - name: REGISTRY_HOST
              value: registry
            - name: REGISTRY_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /tools.descartes.teastore.webui/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: teastore
  labels:
    app: teastore
    component: webui
spec:
  type: LoadBalancer
  selector:
    app: teastore
    component: webui
  ports:
    - port: 8080
      targetPort: 8080
