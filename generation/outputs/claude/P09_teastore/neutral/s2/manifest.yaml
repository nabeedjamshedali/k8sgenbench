apiVersion: v1
kind: Namespace
metadata:
  name: teastore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: teastore
  labels:
    app: teastore
    component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      component: registry
  template:
    metadata:
      labels:
        app: teastore
        component: registry
    spec:
      containers:
        - name: registry
          image: descartesresearch/teastore-registry:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: registry
            - name: SERVICE_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: teastore
  labels:
    app: teastore
    component: registry
spec:
  selector:
    app: teastore
    component: registry
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: teastore
  labels:
    app: teastore
    component: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teastore
      component: db
  template:
    metadata:
      labels:
        app: teastore
        component: db
    spec:
      containers:
        - name: db
          image: descartesresearch/teastore-db:latest
          ports:
            - containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: teastore
  labels:
    app: teastore
    component: db
spec:
  selector:
    app: teastore
    component: db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence
  namespace: teastore
  labels:
    app: teastore
    component: persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore
      component: persistence
  template:
    metadata:
      labels:
        app: teastore
        component: persistence
    spec:
      containers:
        - name: persistence
          image: descartesresearch/teastore-persistence:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOST_NAME
              value: persistence
            - name: SERVICE_PORT
              value: "8080"
            - name: REGISTRY_HOST
              value: registry
            - name: REGISTRY_PORT
              value: "8080"
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: persistence
  namespace: teastore
  labels:
    app: teastore
    component: persistence
spec:
  selector:
    app: teastore
    component: persistence
  ports:
    - port: 8080
      targetPort: 8080
