apiVersion: v1
kind: Namespace
metadata:
  name: teastore
  labels:
    app.kubernetes.io/part-of: teastore
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teastore
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teastore-config
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
data:
  REGISTRY_HOST: "registry"
  REGISTRY_PORT: "8080"
  SERVICE_PORT: "8080"
  USE_POD_IP: "true"
  DB_HOST: "db"
  DB_PORT: "3306"
  RECOMMENDER_ALGORITHM: "SlopeOne"
  RECOMMENDER_RETRAIN_LOOP_TIME: "0"
---
# ---------------------------------------------------------------- registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: registry
          image: descartesresearch/teastore-registry:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOST_NAME
              value: "registry"
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: teastore-config
                  key: SERVICE_PORT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ---------------------------------------------------------------- database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: teastore
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: database
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: db
          image: descartesresearch/teastore-db:latest
          imagePullPolicy: Always
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: db
          app.kubernetes.io/part-of: teastore
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: teastore
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
# ---------------------------------------------------------------- persistence
apiVersion: apps/v1
