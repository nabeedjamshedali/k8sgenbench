            - configMapRef:
                name: teastore-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: persistence
  namespace: teastore
  labels:
    app.kubernetes.io/name: persistence
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: persistence
  ports:
    - name: http
      port: 8080
      targetPort: http
---
