# ---------------------------------------------------------------- webui
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: teastore
  labels:
    app.kubernetes.io/name: webui
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: webui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webui
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: webui
      containers:
        - name: webui
          image: descartesresearch/teastore-webui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: teastore-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /tools.descartes.teastore.webui/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: teastore
  labels:
    app.kubernetes.io/name: webui
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teastore
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webui
  namespace: teastore
  labels:
    app.kubernetes.io/name: webui
    app.kubernetes.io/part-of: teastore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webui
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ---------------------------------------------------------------- disruption budgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webui
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webui
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: persistence
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: persistence
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: image
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recommender
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommender
---
# ---------------------------------------------------------------- network policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: teastore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: teastore
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["registry", "persistence", "auth", "image", "recommender", "webui"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: teastore
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webui-from-anywhere
  namespace: teastore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webui
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-persistence
  namespace: teastore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: persistence
      ports:
        - protocol: TCP
          port: 3306
