  labels:
    app.kubernetes.io/name: teastore-webui
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: webui
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
