  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-webui
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: webui
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
