                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: teastore-webui
      containers:
        - name: webui
          image: descartesresearch/teastore-webui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REGISTRY_HOST
              valueFrom:
                configMapKeyRef:
                  name: teastore-config
                  key: REGISTRY_HOST
            - name: REGISTRY_PORT
              valueFrom:
                configMapKeyRef:
                  name: teastore-config
                  key: REGISTRY_PORT
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: teastore-config
                  key: SERVICE_PORT
            - name: USE_POD_IP
              valueFrom:
                configMapKeyRef:
                  name: teastore-config
                  key: USE_POD_IP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /tools.descartes.teastore.webui/
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /tools.descartes.teastore.webui/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /tools.descartes.teastore.webui/
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
