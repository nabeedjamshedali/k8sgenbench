apiVersion: v1
kind: Namespace
metadata:
  name: teastore
  labels:
    app.kubernetes.io/part-of: teastore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teastore-config
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
data:
  REGISTRY_HOST: "teastore-registry"
  REGISTRY_PORT: "8080"
  SERVICE_PORT: "8080"
  USE_POD_IP: "true"
  DB_HOST: "teastore-db"
  DB_PORT: "3306"
  RECOMMENDER_ALGORITHM: "SlopeOne"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teastore
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
automountServiceAccountToken: false
---
# ---------------- Registry ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-registry
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: registry
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: descartesresearch/teastore-registry:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOST_NAME
              value: "teastore-registry"
            - name: SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: teastore-config
                  key: SERVICE_PORT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teastore-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ---------------- Database ----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teastore-db
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: database
spec:
  serviceName: teastore-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-db
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db
          image: descartesresearch/teastore-db:latest
          imagePullPolicy: Always
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: teastore-db
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-db
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teastore-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
# ---------------- Persistence ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-persistence
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-persistence
    app.kubernetes.io/part-of: teastore
    app.kubernetes.io/component: persistence
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-persistence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-persistence
        app.kubernetes.io/part-of: teastore
        app.kubernetes.io/component: persistence
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: teastore-persistence
      containers:
        - name: persistence
          image: descartesresearch/teastore-persistence:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: teastore-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-persistence
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-persistence
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teastore-persistence
  ports:
    - name: http
      port: 8080
      targetPort: http
