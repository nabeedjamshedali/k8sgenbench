apiVersion: v1
kind: Namespace
metadata:
  name: emojivoto
---
apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app: emojivoto
    component: emoji-svc
spec:
  selector:
    app: emojivoto
    component: emoji-svc
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
  clusterIP: None   # headless for direct pod DNS (optional)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app: emojivoto
    component: emoji-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emojivoto
      component: emoji-svc
  template:
    metadata:
      labels:
        app: emojivoto
        component: emoji-svc
    spec:
      containers:
        - name: emoji-svc
          image: buoyantio/emojivoto-emoji-svc:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: GRPC_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: grpc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app: emojivoto
    component: voting-svc
spec:
  selector:
    app: emojivoto
    component: voting-svc
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8801
      targetPort: 8801
  clusterIP: None   # headless for direct pod DNS (optional)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app: emojivoto
    component: voting-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emojivoto
      component: voting-svc
  template:
    metadata:
      labels:
        app: emojivoto
        component: voting-svc
    spec:
      containers:
        - name: voting-svc
          image: buoyantio/emojivoto-voting-svc:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: GRPC_PORT
              value: "8080"
            # PROM_PORT is optional; left unset to enable metrics on 8801
          ports:
            - containerPort: 8080
              name: grpc
            - containerPort: 8801
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: emojivoto
  labels:
    app: emojivoto
    component: web
spec:
  selector:
    app: emojivoto
    component: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: LoadBalancer   # expose externally; change to NodePort if LB not available
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: emojivoto
  labels:
    app: emojivoto
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emojivoto
      component: web
  template:
    metadata:
      labels:
        app: emojivoto
        component: web
    spec:
      containers:
        - name: web
          image: buoyantio/emojivoto-web:v11
          imagePullPolicy: IfNotPresent
          env:
            - name: WEB_PORT
              value: "8080"
            - name: EMOJISVC_HOST
              value: "emoji-svc:8080"
            - name: VOTINGSVC_HOST
              value: "voting-svc:8080"
            - name: INDEX_BUNDLE
              value: "dist/index_bundle.js"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: emojivoto
  labels:
    app: emojivoto
    component: vote-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emojivoto
      component: vote-bot
  template:
    metadata:
      labels:
        app: emojivoto
        component: vote-bot
    spec:
      containers:
        - name: vote-bot
          image: buoyantio/emojivoto-web:v11
          imagePullPolicy: IfNotPresent
          command: ["emojivoto-vote-bot"]
          env:
            - name: WEB_HOST
              value: "web:8080"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          # The bot runs continuously; simple liveness via exec check
          livenessProbe:
            exec:
              command: ["pgrep", "emojivoto-vote-bot"]
            initialDelaySeconds: 30
            periodSeconds: 30