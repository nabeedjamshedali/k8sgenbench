kind: ConfigMap
metadata:
  name: db-schema
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api
  name: api
spec:
  clusterIP: None
  ports:
  - name: api
    port: 8080
    targetPort: 8080
  selector:
    app: api
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: db
  name: db
spec:
  clusterIP: None
  ports:
  - name: db
    port: 5432
    targetPort: 5432
  selector:
    app: db
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: web
  name: web
spec:
  ports:
  - name: web
    port: 8080
    targetPort: 80
  selector:
    app: web
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - image: dockersamples/wordsmith-api
        name: api
        ports:
        - containerPort: 8080
          name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: db
  name: db
spec:
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - image: postgres:10.0-alpine
        name: db
        ports:
        - containerPort: 5432
          name: db
        volumeMounts:
        - mountPath: /docker-entrypoint-initdb.d
          name: db-schema
      volumes:
      - configMap:
          name: db-schema
        name: db-schema
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - image: dockersamples/wordsmith-web
        name: web
        ports:
        - containerPort: 80
          name: web
