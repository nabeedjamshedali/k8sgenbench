apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: teastore-webui
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-webui
    app.kubernetes.io/part-of: teastore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teastore-webui
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: teastore-webui
  namespace: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-webui
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: teastore-persistence
  namespace: teastore
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-persistence
---
apiVersion: policy/v1
