---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teastore
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
spec:
  rules:
  - host: teastore.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: teastore-webui
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: teastore
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-persistence
  namespace: teastore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: teastore-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: teastore-persistence
    ports:
    - protocol: TCP
      port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: teastore
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - teastore-registry
      - teastore-persistence
      - teastore-auth
      - teastore-image
      - teastore-recommender
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: teastore
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webui-ingress
  namespace: teastore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: teastore-webui
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
