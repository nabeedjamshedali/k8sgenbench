apiVersion: v1
kind: Namespace
metadata:
  name: teastore
  labels:
    app.kubernetes.io/part-of: teastore
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teastore
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teastore-config
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: teastore
data:
  REGISTRY_HOST: teastore-registry
  REGISTRY_PORT: '8080'
  SERVICE_PORT: '8080'
  USE_POD_IP: 'true'
  DB_HOST: teastore-db
  DB_PORT: '3306'
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-db
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teastore-db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teastore-db
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/part-of: teastore
spec:
  serviceName: teastore-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-db
        app.kubernetes.io/part-of: teastore
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: db
        image: descartesresearch/teastore-db:latest
        imagePullPolicy: Always
        ports:
        - name: mysql
          containerPort: 3306
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: teastore-db
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teastore-registry
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/part-of: teastore
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teastore-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teastore-registry
        app.kubernetes.io/part-of: teastore
    spec:
      serviceAccountName: teastore
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: registry
        image: descartesresearch/teastore-registry:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: USE_POD_IP
          valueFrom:
            configMapKeyRef:
              name: teastore-config
              key: USE_POD_IP
        - name: SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: teastore-config
              key: SERVICE_PORT
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          failureThreshold: 5
---
