apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-ingress
  namespace: online-boutique
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - frontend
      - cartservice
      - checkoutservice
      - currencyservice
      - paymentservice
      - shippingservice
      - emailservice
      - productcatalogservice
      - recommendationservice
      - adservice
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
  - ports:
    - protocol: TCP
      port: 8080
    from: []
