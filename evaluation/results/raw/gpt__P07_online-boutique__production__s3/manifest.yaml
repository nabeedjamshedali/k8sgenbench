apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cart-ingress
  namespace: online-boutique
spec:
  podSelector:
    matchLabels:
      app: redis-cart
  policyTypes:
  - Ingress
