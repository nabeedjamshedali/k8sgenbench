apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    service: n8n-claim0
  name: n8n-claim0
  namespace: n8n
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: n8n
    spec:
      initContainers:
      - name: volume-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - chown 1000:1000 /data
        volumeMounts:
        - name: n8n-claim0
          mountPath: /data
      containers:
      - command:
        - /bin/sh
        args:
        - -c
        - sleep 5; n8n start
        env:
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgres-service.n8n.svc.cluster.local
        - name: DB_POSTGRESDB_PORT
          value: '5432'
        - name: DB_POSTGRESDB_DATABASE
          value: n8n
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_PASSWORD
        - name: N8N_PROTOCOL
          value: http
        - name: N8N_PORT
          value: '5678'
        image: n8nio/n8n:2.43.5
        name: n8n
        ports:
        - containerPort: 5678
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: n8n-claim0
      restartPolicy: Always
      volumes:
      - name: n8n-claim0
        persistentVolumeClaim:
          claimName: n8n-claim0
      - name: n8n-secret
        secret:
          secretName: n8n-secret
      - name: postgres-secret
        secret:
          secretName: postgres-secret
---
apiVersion: v1
kind: Service
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  type: LoadBalancer
  ports:
  - name: '5678'
    port: 5678
    targetPort: 5678
    protocol: TCP
  selector:
    service: n8n
---
apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: postgresql-pv
  namespace: n8n
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-data
  namespace: n8n
data:
  init-data.sh: "#!/bin/bash\nset -e;\nif [ -n \"${POSTGRES_NON_ROOT_USER:-}\" ] &&\
    \ [ -n \"${POSTGRES_NON_ROOT_PASSWORD:-}\" ]; then\n\tpsql -v ON_ERROR_STOP=1\
    \ --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\" \\\n\t\t-v n8n_user=\"\
    $POSTGRES_NON_ROOT_USER\" -v n8n_password=\"$POSTGRES_NON_ROOT_PASSWORD\" -v n8n_db=\"\
    $POSTGRES_DB\" <<-'EOSQL'\n\t\tSELECT format('CREATE USER %I', :'n8n_user') WHERE\
    \ NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'n8n_user') \\gexec\n\t\t\
    SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'n8n_user', :'n8n_password')\
    \ WHERE :'n8n_user' <> current_user \\gexec\n\t\tSELECT format('GRANT ALL PRIVILEGES\
    \ ON DATABASE %I TO %I', :'n8n_db', :'n8n_user') \\gexec\n\t\tSELECT format('GRANT\
    \ ALL ON SCHEMA public TO %I', :'n8n_user') \\gexec\n\tEOSQL\nelse\n\techo \"\
    SETUP INFO: No Environment variables given!\"\nfi\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: postgres-n8n
  name: postgres
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: postgres-n8n
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: postgres-n8n
    spec:
      containers:
      - image: postgres:18
        name: postgres
        resources:
          limits:
            cpu: '4'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgresql-pv
          mountPath: /var/lib/postgresql/data
        - name: init-data
          mountPath: /docker-entrypoint-initdb.d/init-n8n-user.sh
          subPath: init-data.sh
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: n8n
        - name: POSTGRES_NON_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_USER
        - name: POSTGRES_NON_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_PASSWORD
        - name: POSTGRES_HOST
          value: postgres-service
        - name: POSTGRES_PORT
          value: '5432'
      restartPolicy: Always
      volumes:
      - name: postgresql-pv
        persistentVolumeClaim:
          claimName: postgresql-pv
      - name: postgres-secret
        secret:
          secretName: postgres-secret
      - name: init-data
        configMap:
          name: init-data
          defaultMode: 484
---
apiVersion: v1
kind: Secret
metadata:
  namespace: n8n
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: changeUser
  POSTGRES_PASSWORD: changePassword
  POSTGRES_DB: n8n
  POSTGRES_NON_ROOT_USER: changeNonRootUser
  POSTGRES_NON_ROOT_PASSWORD: changeNonRootPassword
---
apiVersion: v1
kind: Service
metadata:
  labels:
    service: postgres-n8n
  name: postgres-service
  namespace: n8n
spec:
  clusterIP: None
  ports:
  - name: '5432'
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    service: postgres-n8n
