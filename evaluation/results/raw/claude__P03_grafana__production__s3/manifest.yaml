apiVersion: v1
kind: Namespace
metadata:
  name: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE-ME-strong-password
  secret-key: CHANGE-ME-random-signing-key-32chars
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  grafana.ini: '[server]

    protocol = http

    http_port = 3000

    domain = grafana.example.com

    root_url = https://grafana.example.com/

    enable_gzip = true


    [paths]

    data = /var/lib/grafana

    logs = /var/log/grafana

    plugins = /var/lib/grafana/plugins

    provisioning = /etc/grafana/provisioning


    [log]

    mode = console

    level = info


    [log.console]

    format = json


    [security]

    disable_initial_admin_creation = false

    cookie_secure = true

    cookie_samesite = lax

    allow_embedding = false

    disable_gravatar = true

    strict_transport_security = true

    strict_transport_security_max_age_seconds = 31536000

    x_content_type_options = true

    content_security_policy = true


    [users]

    allow_sign_up = false

    allow_org_create = false

    auto_assign_org_role = Viewer


    [auth.anonymous]

    enabled = false


    [analytics]

    reporting_enabled = false

    check_for_updates = false

    check_for_plugin_updates = false


    [snapshots]

    external_enabled = false


    [metrics]

    enabled = true


    [unified_alerting]

    enabled = true


    [database]

    type = sqlite3

    path = grafana.db

    wal = true

    high_availability = false

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: dashboard
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:11.6.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-grafana
          containerPort: 3000
          protocol: TCP
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
        - name: GF_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: secret-key
        readinessProbe:
          httpGet:
            path: /api/health
            port: http-grafana
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http-grafana
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http-grafana
          periodSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 750Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: grafana
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: grafana-config
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
  - name: http-grafana
    port: 3000
    targetPort: http-grafana
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - grafana.example.com
    secretName: grafana-tls
  rules:
  - host: grafana.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              name: http-grafana
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
