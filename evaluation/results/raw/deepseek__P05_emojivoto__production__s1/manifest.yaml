apiVersion: v1
kind: Namespace
metadata:
  name: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
---
apiVersion: v1
kind: Service
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: emoji-svc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: emoji-svc
  ports:
  - name: grpc
    port: 8080
    targetPort: grpc
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emoji-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: emoji-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: emoji-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emojivoto
        app.kubernetes.io/component: emoji-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: emoji-svc
        image: buoyantio/emojivoto-emoji-svc:v11
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        env:
        - name: GRPC_PORT
          value: '8080'
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: voting-svc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: voting-svc
  ports:
  - name: grpc
    port: 8080
    targetPort: grpc
    protocol: TCP
  - name: prom
    port: 8801
    targetPort: prom
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: voting-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: voting-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emojivoto
        app.kubernetes.io/component: voting-svc
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8801'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: voting-svc
        image: buoyantio/emojivoto-voting-svc:v11
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        - name: prom
          containerPort: 8801
          protocol: TCP
        env:
        - name: GRPC_PORT
          value: '8080'
        - name: PROM_PORT
          value: '8801'
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: web
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emojivoto
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: web
        image: buoyantio/emojivoto-web:v11
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: WEB_PORT
          value: '8080'
        - name: EMOJISVC_HOST
          value: emoji-svc:8080
        - name: VOTINGSVC_HOST
          value: voting-svc:8080
        - name: INDEX_BUNDLE
          value: dist/index_bundle.js
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: vote-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: vote-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emojivoto
        app.kubernetes.io/component: vote-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vote-bot
        image: buoyantio/emojivoto-web:v11
        imagePullPolicy: IfNotPresent
        command:
        - emojivoto-vote-bot
        env:
        - name: WEB_HOST
          value: web:8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: web
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: emojivoto.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: emojivoto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: emoji-svc
  namespace: emojivoto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: emoji-svc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voting-svc
  namespace: emojivoto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: voting-svc
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: voting-svc
  namespace: emojivoto
  labels:
    app.kubernetes.io/name: emojivoto
    app.kubernetes.io/component: voting-svc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: emojivoto
      app.kubernetes.io/component: voting-svc
  endpoints:
  - port: prom
    interval: 30s
    path: /metrics
