apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
spec:
  template:
    spec:
      containers:
      - name: user-sim
        image: weaveworksdemos/load-test:0.1.1
        args:
        - -d
        - '60'
        - -r
        - '200'
        - -c
        - '2'
        - -h
        - edge-router
        securityContext:
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Never
  backoffLimit: 0
