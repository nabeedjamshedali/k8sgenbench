metadata:
  name: frontend
  namespace: online-boutique
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: online-boutique
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
