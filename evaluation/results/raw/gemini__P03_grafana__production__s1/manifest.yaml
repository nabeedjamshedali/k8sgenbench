apiVersion: v1
kind: Namespace
metadata:
  name: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: ChangeMeProductionPassword123!
  secret-key: SW2YcwTIb9zpOOhoPsMm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  grafana.ini: '[paths]

    data = /var/lib/grafana

    logs = /var/log/grafana

    plugins = /var/lib/grafana/plugins

    provisioning = /etc/grafana/provisioning


    [server]

    protocol = http

    http_port = 3000

    domain = localhost

    enforce_domain = false

    enable_gzip = true


    [security]

    disable_initial_admin_creation = false

    admin_user = admin

    cookie_secure = false

    cookie_samesite = lax

    allow_embedding = false

    x_content_type_options = true

    x_xss_protection = true


    [users]

    allow_sign_up = false

    allow_org_create = false

    auto_assign_org = true

    auto_assign_org_role = Viewer

    default_theme = dark


    [auth.basic]

    enabled = true


    [analytics]

    reporting_enabled = false

    check_for_updates = true


    [log]

    mode = console

    level = info

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: core
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:11.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: admin-password
        - name: GF_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: secret-key
        - name: GF_PATHS_CONFIG
          value: /etc/grafana/grafana.ini
        - name: GF_PATHS_DATA
          value: /var/lib/grafana
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 750Mi
          limits:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: config
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
