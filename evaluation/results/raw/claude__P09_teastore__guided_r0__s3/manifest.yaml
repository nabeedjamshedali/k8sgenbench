apiVersion: v1
kind: Namespace
metadata:
  name: teastore
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: teastore
spec:
  selector:
    app: registry
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: teastore
spec:
  selector:
    app: db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: persistence
  namespace: teastore
spec:
  selector:
    app: persistence
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: teastore
spec:
  selector:
    app: auth
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: image
  namespace: teastore
spec:
  selector:
    app: image
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: recommender
  namespace: teastore
spec:
  selector:
    app: recommender
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: teastore
spec:
  selector:
    app: webui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: teastore
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: descartesresearch/teastore-db:latest
        ports:
        - name: mysql
          containerPort: 3306
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          tcpSocket:
            port: 3306
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 3306
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
      - name: registry
        image: descartesresearch/teastore-registry:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: HOST_NAME
          value: registry
        - name: SERVICE_PORT
          value: '8080'
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence
  namespace: teastore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: persistence
  template:
    metadata:
      labels:
        app: persistence
    spec:
      containers:
      - name: persistence
        image: descartesresearch/teastore-persistence:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: USE_POD_IP
          value: 'true'
        - name: REGISTRY_HOST
          value: registry
        - name: REGISTRY_PORT
          value: '8080'
        - name: SERVICE_PORT
          value: '8080'
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: '3306'
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
