apiVersion: v1
kind: Namespace
metadata:
  name: my-grafana
  labels:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: my-grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_WITH_STRONG_PASSWORD
  secret-key: REPLACE_WITH_RANDOM_SECRET_KEY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: my-grafana
data:
  grafana.ini: 'app_mode = production


    [paths]

    data = /var/lib/grafana

    logs = /var/log/grafana

    plugins = /var/lib/grafana/plugins

    provisioning = /etc/grafana/provisioning


    [server]

    protocol = http

    http_addr = 0.0.0.0

    http_port = 3000

    domain = localhost

    enforce_domain = false

    root_url = %(protocol)s://%(domain)s:%(http_port)s/

    serve_from_sub_path = false

    enable_gzip = true


    [database]

    type = sqlite3

    path = grafana.db

    wal = false

    high_availability = false


    [remote_cache]

    type = database


    [analytics]

    reporting_enabled = false

    check_for_updates = true

    check_for_plugin_updates = true


    [security]

    disable_initial_admin_creation = false

    cookie_secure = false

    cookie_samesite = lax

    allow_embedding = false

    disable_brute_force_login_protection = false


    [users]

    allow_sign_up = false

    allow_org_create = false

    auto_assign_org = true

    auto_assign_org_role = Viewer

    default_theme = dark

    default_language = en-US


    [auth]

    disable_login = false

    disable_login_form = false


    [auth.anonymous]

    enabled = false


    [auth.basic]

    enabled = true

    password_policy = true


    [log]

    mode = console

    level = info


    [dashboards]

    versions_to_keep = 20

    min_refresh_interval = 5s


    [metrics]

    enabled = true

    basic_auth_username =

    basic_auth_password =

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: my-grafana
  labels:
    app: grafana
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
        - name: GF_SECURITY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: secret-key
        - name: GF_PATHS_CONFIG
          value: /etc/grafana/grafana.ini
        - name: GF_PATHS_DATA
          value: /var/lib/grafana
        - name: GF_PATHS_LOGS
          value: /var/log/grafana
        - name: GF_PATHS_PLUGINS
          value: /var/lib/grafana/plugins
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: grafana-config
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: my-grafana
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
    nodePort: 32182
    protocol: TCP
