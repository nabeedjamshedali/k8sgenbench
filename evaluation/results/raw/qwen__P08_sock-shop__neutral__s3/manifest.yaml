      hostPort: 80
      hostIP: 0.0.0.0
      container: 80
      host: 80
      protocol: TCP
    env:
    - name: JAVA_OPTS
      value: -Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
    securityContext:
      readOnly: true
      capabilities:
        add:
        - NET_BIND_SERVICE
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    volumes:
    - name: tmp
      emptyDir: {}
