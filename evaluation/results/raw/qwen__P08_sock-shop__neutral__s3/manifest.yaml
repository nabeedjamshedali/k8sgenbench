apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sock-shop
  namespace: sock-shop
---
apiVersion: v1
data:
  MYSQL_ROOT_PASSWORD: password
  MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
  MYSQL_DATABASE: socksdb
kind: Secret
metadata:
  name: catalogue-db-secret
  namespace: sock-shop
type: Opaque
---
apiV1: v1
apiVersion: v1
kind: Pod
metadata:
  name: front
  namespace: front
  labels:
    name: front
spec:
  containers:
  - name: front
    image: weaveworks/front:0.3.12
    ports:
    - name: http
      hostPort: 80
      hostIP: 0.0.0.0
      container: 80
      host: 80
      protocol: TCP
    securityContext:
      readOnly: true
      capabilities:
        add:
        - NET_BIND_SERVICE
        - CHON
        - SEUGID
        - SETUID
        - DAC_OVERRIDE
    volumeMounts:
    - name: tmp
      mountPath: /var/run
    volumes:
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: sock-shop
  labels:
    name: front
spec:
  selector:
    name: front
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
