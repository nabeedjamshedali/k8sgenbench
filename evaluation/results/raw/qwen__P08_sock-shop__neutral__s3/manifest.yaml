    ports:
    - name: http
      hostPort: 80
      hostIP: 0.0.0.0
      container: 80
      host: 80
      protocol: TCP
    - name: http-alt
      hostPort: 8080
      hostIP: 0.0.0.0
      container: 8080
      host: 8080
      protocol: TCP
    securityContext:
      readOnly: true
      capabilities:
        add:
        - NET_BIND_SERVICE
        - CHON
        - SEUGID
        - SETUID
        - DAC_OVERRIDE
    volumeMounts:
    - name: tmp
      mountPath: /var/run
    volumes:
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
