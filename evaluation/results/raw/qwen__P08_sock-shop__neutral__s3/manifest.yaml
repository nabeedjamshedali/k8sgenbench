  namespace: sock-shop
  labels:
    name: edge-router
spec:
  selector:
    name: edge-router
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: http-alt
    port: 8080
    targetPort: 8080
    protocol: TCP
---
