apiVersion: v1
kind: Pod
metadata:
  name: catalogue-db
  namespace: sock-shop
  labels:
    name: catalogue-db
spec:
  containers:
  - name: catalogue-db
    image: weaveworks/catalogue-db:0.3.0
    ports:
    - name: mysql
      hostPort: 3306
      hostIP: 0.0.0.0
      container: 3306
      host: 3306
      protocol: TCP
    env:
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: catalogue-db-secret
          key: MYSQL_ROOT_PASSWORD
    - name: MYSQL_ALLOW_EMPTY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: catalogue-db-secret
          key: MYSQL_ALLOW_EMPTY_PASSWORD
    - name: MYSQL_DATABASE
      valueFrom:
        secretKeyRef:
          name: catalogue-db-secret
          key: MYSQL_DATABASE
    securityContext:
      readOnly: true
      capabilities:
        add:
        - NET_BIND_SERVICE
    volumeMounts:
    - name: tmp
      mountPath: /var/run
    volumes:
    - name: tmp
      emptyDir: {}
---
