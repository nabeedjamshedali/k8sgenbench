apiVersion: v1
kind: Namespace
metadata:
  name: n8n
  labels:
    app.kubernetes.io/part-of: n8n
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: n8n
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: n8n
type: Opaque
stringData:
  POSTGRES_USER: postgres_admin
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_POSTGRES_ADMIN_PASSWORD
  POSTGRES_DB: n8n
  POSTGRES_NON_ROOT_USER: n8n_app
  POSTGRES_NON_ROOT_PASSWORD: CHANGE_ME_STRONG_N8N_DATABASE_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: CHANGE_ME_GENERATE_A_LONG_RANDOM_ENCRYPTION_KEY
  RUNNERS_AUTH_TOKEN: CHANGE_ME_GENERATE_A_LONG_RANDOM_RUNNER_TOKEN
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: n8n
  labels:
    app.kubernetes.io/name: postgres
data:
  init-data.sh: "#!/bin/bash\nset -Eeuo pipefail\n\nif [[ -z \"${POSTGRES_NON_ROOT_USER:-}\"\
    \ ]] ||\n   [[ -z \"${POSTGRES_NON_ROOT_PASSWORD:-}\" ]]; then\n  echo \"ERROR:\
    \ Missing PostgreSQL application credentials.\"\n  exit 1\nfi\n\nif [[ \"$POSTGRES_NON_ROOT_USER\"\
    \ == \"$POSTGRES_USER\" ]]; then\n  echo \"ERROR: Application user must differ\
    \ from admin user.\"\n  exit 1\nfi\n\npsql \\\n  -v ON_ERROR_STOP=1 \\\n  --username\
    \ \"$POSTGRES_USER\" \\\n  --dbname \"$POSTGRES_DB\" \\\n  -v app_user=\"$POSTGRES_NON_ROOT_USER\"\
    \ \\\n  -v app_password=\"$POSTGRES_NON_ROOT_PASSWORD\" \\\n  -v db_name=\"$POSTGRES_DB\"\
    \ <<'EOSQL'\n\nSELECT format(\n  'CREATE ROLE %I LOGIN PASSWORD %L',\n  :'app_user',\n\
    \  :'app_password'\n)\nWHERE NOT EXISTS (\n  SELECT 1\n  FROM pg_roles\n  WHERE\
    \ rolname = :'app_user'\n)\n\\gexec\n\nSELECT format(\n  'GRANT CONNECT, TEMPORARY\
    \ ON DATABASE %I TO %I',\n  :'db_name',\n  :'app_user'\n)\n\\gexec\n\nSELECT format(\n\
    \  'GRANT USAGE, CREATE ON SCHEMA public TO %I',\n  :'app_user'\n)\n\\gexec\n\n\
    SELECT format(\n  'GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO %I',\n\
    \  :'app_user'\n)\n\\gexec\n\nSELECT format(\n  'GRANT ALL PRIVILEGES ON ALL SEQUENCES\
    \ IN SCHEMA public TO %I',\n  :'app_user'\n)\n\\gexec\n\nEOSQL\n\necho \"PostgreSQL\
    \ application user initialized successfully.\"\n"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: n8n
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: n8n
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: n8n
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: n8n
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: n8n
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256
        - name: POSTGRES_HOST_AUTH_METHOD
          value: scram-sha-256
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql
        - name: postgres-init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - "pg_isready \\\n  -h 127.0.0.1 \\\n  -p 5432 \\\n  -U \"$POSTGRES_USER\"\
              \ \\\n  -d \"$POSTGRES_DB\"\n"
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - "pg_isready \\\n  -h 127.0.0.1 \\\n  -p 5432 \\\n  -U \"$POSTGRES_USER\"\
              \ \\\n  -d \"$POSTGRES_DB\"\n"
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - "pg_isready \\\n  -h 127.0.0.1 \\\n  -p 5432 \\\n  -U \"$POSTGRES_USER\"\
              \ \\\n  -d \"$POSTGRES_DB\"\n"
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
      volumes:
      - name: postgres-init-script
        configMap:
          name: postgres-init
          defaultMode: 365
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
      labels:
        app.kubernetes.io/name: postgres
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
data:
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: '5432'
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_SCHEMA: public
  N8N_HOST: n8n.example.com
  N8N_PORT: '5678'
  N8N_PROTOCOL: https
  N8N_EDITOR_BASE_URL: https://n8n.example.com/
  WEBHOOK_URL: https://n8n.example.com/
  N8N_PROXY_HOPS: '1'
  N8N_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_ENABLED: 'true'
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_BROKER_PORT: '5679'
  N8N_DIAGNOSTICS_ENABLED: 'false'
  N8N_PERSONALIZATION_ENABLED: 'false'
  GENERIC_TIMEZONE: UTC
  TZ: UTC
  NODE_ENV: production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-storage
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
  - name: http
    port: 5678
    targetPort: http
    protocol: TCP
  - name: task-broker
    port: 5679
    targetPort: task-broker
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: n8n
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgres
        image: postgres:18
        imagePullPolicy: IfNotPresent
        env:
        - name: PGHOST
          value: postgres
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_PASSWORD
        command:
        - /bin/sh
        - -ec
        - "until psql \\\n  -X \\\n  -v ON_ERROR_STOP=1 \\\n  -Atqc \"SELECT 1\" |\
          \ grep -qx 1; do\n  echo \"Waiting for PostgreSQL and n8n database user...\"\
          \n  sleep 5\ndone\necho \"PostgreSQL is ready.\"\n"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:2.43.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5678
          protocol: TCP
        - name: task-broker
          containerPort: 5679
          protocol: TCP
        envFrom:
        - configMapRef:
            name: n8n-config
        env:
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_USER
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_NON_ROOT_PASSWORD
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_ENCRYPTION_KEY
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: RUNNERS_AUTH_TOKEN
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-runner
  namespace: n8n
  labels:
    app: n8n-runner
    app.kubernetes.io/name: n8n-runner
    app.kubernetes.io/part-of: n8n
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: n8n-runner
  template:
    metadata:
      labels:
        app: n8n-runner
        app.kubernetes.io/name: n8n-runner
        app.kubernetes.io/part-of: n8n
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: n8n-runner
        image: n8nio/runners:2.43.5
        imagePullPolicy: IfNotPresent
        env:
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: RUNNERS_AUTH_TOKEN
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: http://n8n:5679
        - name: NODE_ENV
          value: production
        - name: TZ
          value: UTC
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - n8n.example.com
    secretName: n8n-tls
  rules:
  - host: n8n.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: n8n
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-ingress-policy
  namespace: n8n
spec:
  podSelector:
    matchLabels:
      app: n8n
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 5678
  - from:
    - podSelector:
        matchLabels:
          app: n8n-runner
    ports:
    - protocol: TCP
      port: 5679
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: n8n
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: n8n-pdb
  namespace: n8n
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: n8n
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: n8n-runner-pdb
  namespace: n8n
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: n8n-runner
