apiVersion: batch/v1
kind: CronJob
metadata:
  name: user-sim
  namespace: sock-shop
  labels:
    app: user-sim
    tier: testing
spec:
  schedule: 0 2 * * *
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: user-sim
            tier: testing
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: user-sim
            image: weaveworksdemos/load-test:0.1.1
            imagePullPolicy: IfNotPresent
            args:
            - -d
            - '60'
            - -r
            - '200'
            - -c
            - '2'
            - -h
            - edge-router
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
