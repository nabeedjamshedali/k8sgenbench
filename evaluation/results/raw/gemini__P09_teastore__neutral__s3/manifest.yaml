apiVersion: v1
kind: Service
metadata:
  name: teastore-db
  labels:
    app: teastore-db
spec:
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: teastore-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-db
  labels:
    app: teastore-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-db
  template:
    metadata:
      labels:
        app: teastore-db
    spec:
      containers:
      - name: db
        image: descartesresearch/teastore-db
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  labels:
    app: teastore-registry
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: teastore-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  labels:
    app: teastore-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-registry
  template:
    metadata:
      labels:
        app: teastore-registry
    spec:
      containers:
      - name: registry
        image: descartesresearch/teastore-registry
        ports:
        - containerPort: 8080
        env:
        - name: USE_POD_IP
          value: 'true'
        - name: SERVICE_PORT
          value: '8080'
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-persistence
  labels:
    app: teastore-persistence
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: teastore-persistence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-persistence
  labels:
    app: teastore-persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-persistence
  template:
    metadata:
      labels:
        app: teastore-persistence
    spec:
      containers:
      - name: persistence
        image: descartesresearch/teastore-persistence
        ports:
        - containerPort: 8080
        env:
        - name: USE_POD_IP
          value: 'true'
        - name: SERVICE_PORT
          value: '8080'
        - name: REGISTRY_HOST
          value: teastore-registry
        - name: REGISTRY_PORT
          value: '8080'
        - name: DB_HOST
          value: teastore-db
        - name: DB_PORT
          value: '3306'
---
