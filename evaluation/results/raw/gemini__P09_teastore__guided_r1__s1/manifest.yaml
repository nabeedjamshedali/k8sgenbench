        - containerPort: 8080
        env:
        - name: HOST_NAME
          value: persistence
        - name: USE_POD_IP
          value: 'true'
        - name: REGISTRY_HOST
          value: registry
        - name: REGISTRY_PORT
          value: '8080'
        - name: SERVICE_PORT
          value: '8080'
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: '3306'
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
