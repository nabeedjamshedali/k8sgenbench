apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop
  labels:
    name: sock-shop
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sock-shop-quota
  namespace: sock-shop
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 16Gi
    limits.cpu: '16'
    limits.memory: 32Gi
    persistentvolumeclaims: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sock-shop-defaults
  namespace: sock-shop
spec:
  limits:
  - type: Container
    default:
      cpu: 300m
      memory: 300Mi
    defaultRequest:
      cpu: 100m
      memory: 100Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: catalogue-db-credentials
  namespace: sock-shop
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CHANGE_ME_strong_password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sock-shop
  namespace: sock-shop
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    app: front-end
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-end
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: front-end
    spec:
      serviceAccountName: sock-shop
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: front-end
      containers:
      - name: front-end
        image: weaveworksdemos/front-end:0.3.12
        ports:
        - containerPort: 8079
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /
            port: 8079
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8079
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    app: front-end
spec:
  type: ClusterIP
  selector:
    app: front-end
  ports:
  - port: 80
    targetPort: 8079
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: front-end
  namespace: sock-shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: front-end
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-router-tmp-note
  namespace: sock-shop
data:
  note: edge-router uses emptyDir for /var/run, /var/cache and /tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-router
  namespace: sock-shop
  labels:
    app: edge-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: edge-router
    spec:
      serviceAccountName: sock-shop
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: edge-router
        image: weaveworksdemos/edge-router:0.1.1
        ports:
        - containerPort: 80
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        volumeMounts:
        - name: var-run
          mountPath: /var/run
        - name: var-cache
          mountPath: /var/cache/nginx
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: var-run
        emptyDir:
          medium: Memory
      - name: var-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-router
  namespace: sock-shop
  labels:
    app: edge-router
spec:
  type: ClusterIP
  selector:
    app: edge-router
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: admin
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sock-shop
  namespace: sock-shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sockshop.example.com
    secretName: sock-shop-tls
  rules:
  - host: sockshop.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edge-router
            port:
              number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge-router
  namespace: sock-shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: edge-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: sock-shop
  labels:
    app: catalogue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      serviceAccountName: sock-shop
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: catalogue
        image: weaveworksdemos/catalogue:0.3.5
        command:
        - /app
        args:
        - -port=80
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: sock-shop
  labels:
    app: catalogue
spec:
  selector:
    app: catalogue
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: policy/v1
