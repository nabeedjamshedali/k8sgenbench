apiVersion: v1
kind: Namespace
metadata:
  name: teastore
  labels:
    app.kubernetes.io/name: teastore
    app.kubernetes.io/part-of: teastore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teastore-config
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-config
    app.kubernetes.io/part-of: teastore
data:
  REGISTRY_HOST: teastore-registry
  REGISTRY_PORT: '8080'
  SERVICE_PORT: '8080'
  USE_POD_IP: 'true'
  DB_HOST: teastore-db
  DB_PORT: '3306'
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-db
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: teastore-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-db
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-db
    app.kubernetes.io/part-of: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-db
  template:
    metadata:
      labels:
        app: teastore-db
        app.kubernetes.io/name: teastore-db
        app.kubernetes.io/part-of: teastore
    spec:
      containers:
      - name: db
        image: descartesresearch/teastore-db
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
          name: mysql
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: teastore-registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/part-of: teastore
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: teastore-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teastore-registry
  namespace: teastore
  labels:
    app.kubernetes.io/name: teastore-registry
    app.kubernetes.io/part-of: teastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teastore-registry
  template:
    metadata:
      labels:
        app: teastore-registry
        app.kubernetes.io/name: teastore-registry
        app.kubernetes.io/part-of: teastore
    spec:
      containers:
      - name: registry
        image: descartesresearch/teastore-registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: teastore-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
---
