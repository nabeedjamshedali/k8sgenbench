apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
  labels:
    app: user-sim
spec:
  template:
    metadata:
      labels:
        app: user-sim
    spec:
      restartPolicy: Never
      containers:
      - name: user-sim
        image: weaveworksdemos/load-test:0.1.1
        command:
        - /bin/sh
        - -c
        args:
        - -d 60 -r 200 -c 2 -h edge-router
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
