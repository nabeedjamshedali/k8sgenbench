apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  namespace: sock-shop
spec:
  clusterIP: None
  selector:
    app: catalogue-db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalogue-db
  namespace: sock-shop
spec:
  serviceName: catalogue-db
  replicas: 1
  selector:
    matchLabels:
      app: catalogue-db
  template:
    metadata:
      labels:
        app: catalogue-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: catalogue-db
        image: weaveworksdemos/catalogue-db:0.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalogue-db-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: sock-shop-config
              key: MYSQL_DATABASE
        volumeMounts:
        - name: catalogue-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          failureThreshold: 5
  volumeClaimTemplates:
  - metadata:
      name: catalogue-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
