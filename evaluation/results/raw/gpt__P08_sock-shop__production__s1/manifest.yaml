apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
  labels:
    app: user-sim
    app.kubernetes.io/component: load-test
spec:
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: user-sim
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: user-simulator
        image: weaveworksdemos/load-test:0.1.1
        imagePullPolicy: IfNotPresent
        args:
        - -d
        - '60'
        - -r
        - '200'
        - -c
        - '2'
        - -h
        - edge-router
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
