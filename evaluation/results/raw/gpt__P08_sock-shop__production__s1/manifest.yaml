apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop
  labels:
    app.kubernetes.io/part-of: sock-shop
    app.kubernetes.io/name: sock-shop
---
apiVersion: v1
kind: Secret
metadata:
  name: catalogue-db-secret
  namespace: sock-shop
type: Opaque
stringData:
  mysql-root-password: REPLACE_WITH_STRONG_RANDOM_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sock-shop-config
  namespace: sock-shop
data:
  JAVA_OPTS: -Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
  MYSQL_DATABASE: socksdb
  MONGO_HOST: user-db:27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    app: front-end
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      labels:
        app: front-end
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: front-end
        image: weaveworksdemos/front-end:0.3.12
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8079
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  namespace: sock-shop
spec:
  type: ClusterIP
  selector:
    app: front-end
  ports:
  - name: http
    port: 80
    targetPort: 8079
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-router
  namespace: sock-shop
  labels:
    app: edge-router
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: edge-router
  template:
    metadata:
      labels:
        app: edge-router
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: edge-router
        image: weaveworksdemos/edge-router:0.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: admin
          containerPort: 8080
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        volumeMounts:
        - name: var-run
          mountPath: /var/run
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
      volumes:
      - name: var-run
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: edge-router
  namespace: sock-shop
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: edge-router
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: edge-router-admin
  namespace: sock-shop
spec:
  type: ClusterIP
  selector:
    app: edge-router
  ports:
  - name: admin
    port: 8080
    targetPort: 8080
    protocol: TCP
---
