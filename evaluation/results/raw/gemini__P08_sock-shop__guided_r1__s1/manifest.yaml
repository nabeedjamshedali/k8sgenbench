apiVersion: v1
kind: Secret
metadata:
  name: catalogue-db-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: fake_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  labels:
    app: front-end
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      labels:
        app: front-end
    spec:
      containers:
      - name: front-end
        image: weaveworksdemos/front-end:0.3.12
        ports:
        - containerPort: 8079
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        livenessProbe:
          httpGet:
            path: /
            port: 8079
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8079
          periodSeconds: 10
      volumes:
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: front-end
spec:
  selector:
    app: front-end
  ports:
  - port: 8079
    targetPort: 8079
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-router
  labels:
    app: edge-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-router
  template:
    metadata:
      labels:
        app: edge-router
    spec:
      containers:
      - name: edge-router
        image: weaveworksdemos/edge-router:0.1.1
        ports:
        - name: http
          containerPort: 80
        - name: admin
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/run
          name: var-run-volume
        - mountPath: /tmp
          name: tmp-volume
      volumes:
      - name: var-run-volume
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
