apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app: wordsmith
type: Opaque
stringData:
  POSTGRES_PASSWORD: wordsmith-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: wordsmith
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordsmith
      component: db
  template:
    metadata:
      labels:
        app: wordsmith
        component: db
    spec:
      containers:
      - name: db
        image: postgres:10.0-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: POSTGRES_PASSWORD
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: wordsmith
    component: db
spec:
  selector:
    app: wordsmith
    component: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: wordsmith
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordsmith
      component: api
  template:
    metadata:
      labels:
        app: wordsmith
        component: api
    spec:
      containers:
      - name: api
        image: dockersamples/wordsmith-api
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: wordsmith
    component: api
spec:
  selector:
    app: wordsmith
    component: api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: wordsmith
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordsmith
      component: web
  template:
    metadata:
      labels:
        app: wordsmith
        component: web
    spec:
      containers:
      - name: web
        image: dockersamples/wordsmith-web
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: wordsmith
    component: web
spec:
  type: LoadBalancer
  selector:
    app: wordsmith
    component: web
  ports:
  - port: 8080
    targetPort: 80
