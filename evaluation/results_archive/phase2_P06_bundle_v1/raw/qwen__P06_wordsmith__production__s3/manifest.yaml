apiVersion: v1
kind: Namespace
metadata:
  name: wordsmith
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordsmith-api
  namespace: wordsmith
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordsmith-web
  namespace: wordsmith
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordsmith-db-init
  namespace: wordsmith
data:
  init.sql: "CREATE TABLE IF NOT EXISTS words (\n  id SERIAL PRIMARY KEY,\n  word\
    \ VARCHAR(255) NOT NULL\n);\nINSERT INTO words (word) VALUES\n  ('the'), ('quick'),\
    \ ('brown'), ('fox'), ('jumps'),\n  ('over'), ('lazy'), ('dog'), ('hello'), ('world');\n"
---
apiVersion: v1
kind: Secret
metadata:
  name: wordsmith-db-credentials
  namespace: wordsmith
type: Opaque
stringData:
  POSTGRES_USER: wordsmith
  POSTGRES_PASSWORD: securepassword123
  POSTGRES_DB: wordsmith
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wordsmith-db
  namespace: wordsmith
spec:
  serviceName: wordsmith-db
  replicas: 1
  selector:
    matchLabels:
      app: wordsmith-db
  template:
    metadata:
      labels:
        app: wordsmith-db
    spec:
      containers:
      - name: postgres
        image: postgres:10.0-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: wordsmith-db-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordsmith-db-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: wordsmith-db-credentials
              key: POSTGRES_DB
        volumeMounts:
        - name: db-init
          mountPath: /docker-entrypoint-initdb.d
        - name: db-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: db-init
        configMap:
          name: wordsmith-db-init
      - name: db-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordsmith-db
  namespace: wordsmith
spec:
  selector:
    app: wordsmith-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsmith-api
  namespace: wordsmith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordsmith-api
  template:
    metadata:
      labels:
        app: wordsmith-api
    spec:
      serviceAccountName: wordsmith-api
      containers:
      - name: api
        image: dockersamples/wordsmith-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@wordsmith-db:5432/$(POSTGRES_DB)
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: wordsmith-db-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordsmith-db-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: wordsmith-db-credentials
              key: POSTGRES_DB
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 128Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wordsmith-api
  namespace: wordsmith
spec:
  selector:
    app: wordsmith-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsmith-web
  namespace: wordsmith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordsmith-web
  template:
    metadata:
      labels:
        app: wordsmith-web
    spec:
      serviceAccountName: wordsmith-web
      containers:
      - name: web
        image: dockersamples/wordsmith-web:latest
        ports:
        - containerPort: 80
        env:
        - name: API_HOST
          value: wordsmith-api
        - name: API_PORT
          value: '8080'
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 64Mi
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wordsmith-web
  namespace: wordsmith
spec:
  selector:
    app: wordsmith-web
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordsmith-ingress
  namespace: wordsmith
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: wordsmith.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordsmith-web
            port:
              number: 80
