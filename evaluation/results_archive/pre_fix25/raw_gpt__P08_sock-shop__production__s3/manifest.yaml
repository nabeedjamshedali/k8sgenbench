apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: sock-shop
  labels:
    app: user
spec:
  type: ClusterIP
  selector:
    app: user
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: sock-shop
  labels:
    app: user-db
spec:
  type: ClusterIP
  selector:
    app: user-db
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
  namespace: sock-shop
spec:
  serviceName: user-db
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: user-db
        image: weaveworksdemos/user-db:0.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: mongo
          containerPort: 27017
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETGID
            - SETUID
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        - name: mongo-config
          mountPath: /data/configdb
        - name: tmp
          mountPath: /tmp
        startupProbe:
          tcpSocket:
            port: mongo
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: mongo
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: mongo
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: mongo-config
        emptyDir:
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: user-sim
  namespace: sock-shop
  labels:
    app: user-sim
spec:
  suspend: true
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: user-sim
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
      - name: user-sim
        image: weaveworksdemos/load-test:0.1.1
        imagePullPolicy: IfNotPresent
        args:
        - -d
        - '60'
        - -r
        - '200'
        - -c
        - '2'
        - -h
        - edge-router
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
