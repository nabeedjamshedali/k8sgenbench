apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop
  labels:
    app.kubernetes.io/part-of: sock-shop
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sock-shop-quota
  namespace: sock-shop
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 12Gi
    limits.cpu: '20'
    limits.memory: 24Gi
    requests.storage: 50Gi
    pods: '60'
    persistentvolumeclaims: '10'
---
apiVersion: v1
kind: Secret
metadata:
  name: catalogue-db-secret
  namespace: sock-shop
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_WITH_STRONG_RANDOM_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    app: front-end
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: front-end
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: front-end
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: front-end
              topologyKey: kubernetes.io/hostname
      containers:
      - name: front-end
        image: weaveworksdemos/front-end:0.3.12
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8079
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    app: front-end
spec:
  type: ClusterIP
  selector:
    app: front-end
  ports:
  - name: http
    port: 80
    targetPort: 8079
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-router
  namespace: sock-shop
  labels:
    app: edge-router
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: edge-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: edge-router
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: edge-router
              topologyKey: kubernetes.io/hostname
      containers:
      - name: edge-router
        image: weaveworksdemos/edge-router:0.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        - name: admin
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        volumeMounts:
        - name: var-run
          mountPath: /var/run
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          failureThreshold: 3
      volumes:
      - name: var-run
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: edge-router
  namespace: sock-shop
  labels:
    app: edge-router
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: edge-router
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: edge-router-admin
  namespace: sock-shop
spec:
  type: ClusterIP
  selector:
    app: edge-router
  ports:
  - name: admin
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: sock-shop
  labels:
    app: catalogue
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: catalogue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: catalogue
        image: weaveworksdemos/catalogue:0.3.5
        imagePullPolicy: IfNotPresent
        command:
        - /app
        args:
        - -port=80
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: sock-shop
  labels:
    app: catalogue
spec:
  type: ClusterIP
  selector:
    app: catalogue
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  namespace: sock-shop
  labels:
    app: catalogue-db
spec:
  type: ClusterIP
  selector:
    app: catalogue-db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalogue-db
  namespace: sock-shop
spec:
  serviceName: catalogue-db
  replicas: 1
  selector:
    matchLabels:
      app: catalogue-db
  template:
    metadata:
      labels:
        app: catalogue-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: catalogue-db
        image: weaveworksdemos/catalogue-db:0.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: catalogue-db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: socksdb
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        startupProbe:
          tcpSocket:
            port: mysql
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
